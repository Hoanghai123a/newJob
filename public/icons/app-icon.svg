<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#f4fbfb"/>
  <defs>
    <linearGradient id="hLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FE3D8"/>
      <stop offset="100%" stop-color="#3E9FC4"/>
    </linearGradient>
    <linearGradient id="hDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E9FC4"/>
      <stop offset="100%" stop-color="#1F5F8B"/>
    </linearGradient>
    <linearGradient id="hMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#54C6D0"/>
      <stop offset="50%" stop-color="#7FE3D8"/>
      <stop offset="100%" stop-color="#54C6D0"/>
    </linearGradient>
  </defs>
  <g transform="translate(150, 120)">
    <!-- Left bar: two facets -->
    <polygon points="0,8 106,44 106,272 0,272" fill="url(#hLight)"/>
    <polygon points="0,272 106,272 106,44 0,8 0,272" fill="url(#hDark)" opacity="0.0"/>
    <polygon points="53,26 106,44 106,272 53,264" fill="url(#hDark)"/>
    <!-- Right bar: two facets -->
    <polygon points="106,44 212,8 212,272 106,272" fill="url(#hLight)"/>
    <polygon points="159,26 212,8 212,272 159,264" fill="url(#hDark)"/>
    <!-- Center gem / crossbar -->
    <polygon points="106,120 212,150 106,180 0,150" fill="url(#hMid)"/>
    <polygon points="0,150 106,180 106,120" fill="url(#hDark)" opacity="0.35"/>
    <polygon points="212,150 106,180 106,120" fill="url(#hLight)" opacity="0.55"/>
    <!-- Highlight edges -->
    <line x1="0" y1="8" x2="0" y2="272" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
    <line x1="212" y1="8" x2="212" y2="272" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
    <line x1="0" y1="150" x2="106" y2="180" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="106" y1="180" x2="212" y2="150" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  </g>
</svg>
